<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Visualization</title>
    <link rel="stylesheet" href="../static/css/indexStyle.css">
</head>
<body>
    <div class="mainContainer">
        <h1>Stock Visualization</h1>
        <form method="GET" action="/visualization">
            <input type="text" name="company" id="companySearchText" placeholder="Search a company to visualize..." value="{{ request.args.get('company', '') }}">
            <button type="submit" id="searchCompanyButton">Visualize</button>
        </form>

        {% if selected_company %}
        <h3>{{ selected_company }}</h3>
        {% endif %}

        {% if error %}
        <p class="message">{{ error }}</p>
        {% elif plot_img %}
        <div class="chartCard">
            <img src="data:image/png;base64,{{ plot_img }}" alt="{{ selected_company }} Form 4 activity chart" />
        </div>
        {% else %}
        <p class="message">No visualization available.</p>
        {% endif %}

        <button onclick="window.location.href='/'">Back to Home</button>
    </div>
</body>
</html>
