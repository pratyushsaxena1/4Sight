<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Stock Analysis | 4Sight</title>
    <link rel="stylesheet" href="../static/css/indexStyle.css">
</head>
<body>
    <div class="mainContainer">
        <header class="siteHeader">
            <h2 class="wordmark"><a href="/">4<span class="mark-accent">Sight</span></a></h2>
            <p class="headerTag">Insider Trading Intelligence</p>
        </header>

        <h1>AI Stock Analysis</h1>
        <p class="lede">Claude reads the company's recent Form 4 activity and lays out possible reasons for the trends, weighed against current news about the company.</p>

        <form method="GET" action="/analysis">
            <div class="searchRow">
                <input type="text" name="company" id="companySearchText" placeholder="Search a company to analyze" value="{{ request.args.get('company', '') }}">
                <button type="submit" id="searchCompanyButton">Analyze</button>
            </div>
        </form>

        {% if selected_company %}
        <p class="selectedCompany"><span class="label">Analysis for</span>{{ selected_company }}</p>
        {% endif %}

        <div class="reportCard">
            <pre>{{ output }}</pre>
        </div>

        <button type="button" class="backButton" onclick="window.location.href='/'">&#8592; Back to Home</button>
    </div>
</body>
</html>
